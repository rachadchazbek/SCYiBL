# SCYiBL runtime configuration: behaviour only, never secrets.
# Secrets are referenced by environment-variable name and loaded from the
# environment or a local .env file (see .env.example).
# Validate with:  uv run scyibl config check

providers:
  cohere:
    api_key_env: COHERE_API_KEY

agents:
  router:
    model: cohere/command-a-03-2025
    temperature: 0.0
    max_tokens: 512
  classifier:
    model: cohere/command-a-03-2025   # try cohere/command-r7b-12-2024 to cut cost
    temperature: 0.0
    few_shot_k: 8
  adjudicator:
    model: cohere/command-a-reasoning-08-2025
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 60
  safety:
    model: cohere/command-a-03-2025   # no small model here: recall first (#8)
    temperature: 0.0
    enabled: true

retrieval:
  embed_model: cohere/embed-v4.0
  rerank_model: cohere/rerank-v3.5
  candidates: 30

escalation:
  min_confidence: 0.7
  ambiguity_band: [0.4, 0.6]
  max_depth: 2
  max_cost_usd_per_request: 0.02

dataset:
  repo_id: rachadchazbek/scyibl-data   # private dataset, see #16
  revision: v1.0
  token_env: HF_TOKEN
  required: false                      # becomes true once retrieval (#6) is implemented

clients:
  api_keys_file: secrets/client_keys.json
  rate_limit_per_minute: 60

alerts:
  min_risk_level: elevated
  email:
    enabled: false                     # enable in #8; recipient comes from ALERT_EMAIL_TO
  google_sheet:
    enabled: false
