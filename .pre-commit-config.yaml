repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: block-data-files
        name: Block dataset and model files (data lives in private storage, see #16)
        entry: Data/model files must not be committed. Use the private dataset store.
        language: fail
        files: \.(csv|tsv|parquet|xlsx|pkl|pickle|ckpt|pt|safetensors|jsonl)$
        exclude: ^tests/fixtures/
      - id: block-env-files
        name: Block .env files
        entry: .env files contain secrets and must not be committed.
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: \.env\.example$
